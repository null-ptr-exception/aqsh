apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: aqsh

build:
  local:
    push: false
  tagPolicy:
    sha256: {}
  artifacts:
  - image: aqsh
    docker:
      dockerfile: Dockerfile

deploy:
  kubectl: {}

manifests:
  kustomize:
    paths:
    - k8s

profiles:
- name: remote
  build:
    local:
      push: true
    tagPolicy:
      sha256: {}
    artifacts:
    - image: registry.registry.svc.cluster.local:30500/aqsh
      docker:
        dockerfile: Dockerfile

- name: e2e
  build:
    artifacts:
    - image: aqsh
      docker:
        dockerfile: Dockerfile
    - image: aqsh-test
      docker:
        dockerfile: Dockerfile.test
  manifests:
    kustomize:
      paths:
      - .
  verify:
  - name: integration-test
    container:
      name: integration-test
      image: aqsh-test
      env:
      - name: AQSH_URL
        value: http://aqsh:8080
    executionMode:
      kubernetesCluster: {}

- name: coverage
  patches:
  - op: add
    path: /build/artifacts/0/docker/buildArgs
    value:
      DEBUG: "true"

- name: native-auth
  build:
    artifacts:
    - image: aqsh
      docker:
        dockerfile: Dockerfile
    - image: aqsh-native-test
      docker:
        dockerfile: Dockerfile.native-test
  manifests:
    kustomize:
      paths:
      - test/native-auth
  verify:
  - name: native-auth-test
    container:
      name: native-auth-test
      image: aqsh-native-test
      env:
      - name: AQSH_NATIVE_E2E_URL
        value: http://aqsh:8080
    executionMode:
      kubernetesCluster:
        jobManifestPath: test/native-auth/job.yaml

# Activate together with native-auth to exercise opt-in cluster qualification.
- name: qualified-identity
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: test/qualified-auth
  - op: add
    path: /verify/0/container/env/-
    value:
      name: AQSH_NATIVE_E2E_QUALIFIED
      value: "true"
