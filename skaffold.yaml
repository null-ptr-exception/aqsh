apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: aqsh

build:
  local:
    push: false
  tagPolicy:
    sha256: {}
  artifacts:
  - image: aqsh
    docker:
      dockerfile: Dockerfile

deploy:
  kubectl: {}

manifests:
  kustomize:
    paths:
    - k8s

profiles:
- name: remote
  build:
    local:
      push: true
    tagPolicy:
      sha256: {}
    artifacts:
    - image: registry.registry.svc.cluster.local:30500/aqsh
      docker:
        dockerfile: Dockerfile

- name: e2e
  build:
    artifacts:
    - image: aqsh
      docker:
        dockerfile: Dockerfile
    - image: aqsh-test
      docker:
        dockerfile: Dockerfile.test
  manifests:
    kustomize:
      paths:
      - .
  verify:
  - name: integration-test
    container:
      name: integration-test
      image: aqsh-test
      env:
      - name: AQSH_URL
        value: http://aqsh:8080
    executionMode:
      kubernetesCluster: {}

- name: coverage
  patches:
  - op: add
    path: /build/artifacts/0/docker/buildArgs
    value:
      DEBUG: "true"
