apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aqsh
resources:
- ../../k8s
- mock-values.yaml
configMapGenerator:
- name: aqsh-tasks-config
  namespace: aqsh
  behavior: replace
  files:
  - tasks.yaml
- name: aqsh-mock-values
  files:
  - server.py
# The runner owns namespace creation/deletion so cleanup keeps its claim until
# all other resources are gone. The example base still includes the Namespace.
patches:
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: aqsh
