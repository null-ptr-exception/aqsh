apiVersion: v1
kind: Service
metadata:
  name: mock-values
  namespace: aqsh
spec:
  selector:
    app: mock-values
  ports:
  - port: 8090
    targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-values
  namespace: aqsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-values
  template:
    metadata:
      labels:
        app: mock-values
    spec:
      automountServiceAccountToken: false
      containers:
      - name: mock-values
        image: python:3-alpine
        command: [python, /scripts/server.py]
        ports:
        - containerPort: 8090
        readinessProbe:
          tcpSocket:
            port: 8090
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: script
        configMap:
          name: aqsh-mock-values
