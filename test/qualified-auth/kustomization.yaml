apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aqsh
resources:
- ../native-auth
patches:
- target:
    kind: Deployment
    name: aqsh
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: aqsh
    spec:
      template:
        spec:
          containers:
          - name: aqsh
            env:
            - name: AQSH_AUTH_INCLUDE_CLUSTER_IN_IDENTITY
              value: "true"
            - name: AQSH_AUTH_CLUSTER_NAME
              value: kind-e2e
