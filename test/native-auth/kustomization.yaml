apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aqsh
resources:
- ../../k8s
- rbac.yaml
- worker.yaml
patches:
- path: api.yaml
configMapGenerator:
- name: aqsh-native-auth
  files:
  - auth.yaml
- name: aqsh-native-tasks
  files:
  - tasks.yaml
- name: aqsh-native-scripts
  files:
  - identity.sh
