apiVersion: v1
kind: Service
metadata:
  name: aqsh
  namespace: aqsh
spec:
  selector:
    app: aqsh
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqsh
  namespace: aqsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aqsh
  template:
    metadata:
      labels:
        app: aqsh
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready"

      containers:
      - name: aqsh
        image: aqsh
        ports:
        - containerPort: 8080
        env:
        - name: AQSH_MODE
          value: both
        - name: AQSH_BIND
          value: "0.0.0.0:8080"
        - name: AQSH_REDIS_ADDR
          value: redis:6379
        - name: AQSH_TASKS_CONFIG
          value: /etc/aqsh/tasks.yaml
        - name: AQSH_TASKS_DIR
          value: /tasks
        - name: AQSH_WORKER_QUEUES
          value: default,long-running
        volumeMounts:
        - name: tasks-config
          mountPath: /etc/aqsh
        - name: tasks-extra
          mountPath: /etc/aqsh/tasks.d
        - name: task-scripts
          mountPath: /tasks
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3

      volumes:
      - name: tasks-config
        configMap:
          name: aqsh-tasks-config
      - name: tasks-extra
        configMap:
          name: aqsh-tasks-extra
      - name: task-scripts
        configMap:
          name: aqsh-task-scripts
          defaultMode: 0755
