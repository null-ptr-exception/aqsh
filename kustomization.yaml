apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aqsh
resources:
- k8s
- k8s/mock-values.yaml
configMapGenerator:
- name: aqsh-tasks-config
  files:
  - tasks.yaml
- name: aqsh-tasks-extra
  files:
  - tasks.d/test.yaml
- name: aqsh-task-scripts
  files:
  - tasks/hello.sh
  - tasks/deploy.sh
  - tasks/cleanup.sh
  - tasks/slow.sh
- name: aqsh-mock-values
  files:
  - test/mock-values-server/server.py
